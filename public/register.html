<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | LuMekH™</title><link rel="stylesheet" href="/app.css?v=20261116-image-viewer-1"><script defer src="/app.js?v=20261118-email-code-4digit-1"></script><link rel="icon" type="image/png" href="/assets/lumekh-logo.png?v=brand-20261113"><link rel="apple-touch-icon" href="/assets/lumekh-logo.png?v=brand-20261113"></head><body><div class="shell"><header class="topbar auth-topbar"><a class="brand site-brand" href="/" aria-label="LuMekH home"><img class="brand-logo" src="/assets/lumekh-logo.png?v=brand-20261113" alt=""><span class="brand-copy"><strong>LuMekH™</strong><small>Love We Make</small></span></a><nav aria-label="Main navigation"><a class="navlink" href="/Login">Customer login</a></nav></header><main class="pagehead"><p class="eyebrow">Customer account</p><h1>Create your <span class="gradient">account.</span></h1><div class="panel" style="max-width:540px"><form id="register-form" class="form" data-auth="/api/auth/register" style="margin-top:16px"><div class="field"><label>Full name</label><input name="name" autocomplete="name" required minlength="2"></div><div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required></div><div class="field"><label for="register-mobile">Mobile number</label><input id="register-mobile" name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="40" pattern="\+?[0-9().\s-]{10,24}" title="Enter a mobile number with 10 to 15 digits." required></div><div class="field"><label>Password (10 characters minimum)</label><input name="password" type="password" autocomplete="new-password" minlength="10" required></div><button class="btn primary">Create account</button><div class="message"></div></form></div></main><footer class="footer"></footer></div></body></html>
