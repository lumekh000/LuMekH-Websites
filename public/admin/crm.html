<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM Admin | LuMekH™</title><link rel="stylesheet" href="/app.css"><script defer src="/app.js"></script></head><body><div class="shell"><header class="topbar"><a class="brand" href="/"><span class="brand-mark">L</span>LuMekH™ · CRM Admin</a><nav><a class="navlink" href="/">View site</a><button id="logout" class="btn">Close CRM</button></nav></header><main><section class="pagehead"><p class="eyebrow">Private workspace</p><h1>Business <span class="gradient">overview.</span></h1><p class="muted">Manage customers, store items, services, appointment requests, and orders.</p></section><div id="stats" class="stats"></div><div class="tabs"><button class="btn" data-tab="bookings">Bookings</button><button class="btn" data-tab="orders">Orders</button><button class="btn" data-tab="customers">Customers</button><button class="btn" data-tab="products">Products</button><button class="btn" data-tab="services">Services</button></div><section id="crm" class="panel"><div id="crm-table"></div></section><section class="section grid"><form class="panel form" data-admin="products"><h2>Add product</h2><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Description</label><textarea name="description"></textarea></div><div class="field"><label>Price (₹)</label><input name="price" type="number" min="0" step=".01" required></div><div class="field"><label>Stock (leave blank for unlimited)</label><input name="stock" type="number" min="0" step="1"></div><div class="field"><label>Image URL (optional)</label><input name="imageUrl" type="url"></div><button class="btn primary">Add product</button></form><form class="panel form" data-admin="services"><h2>Add appointment service</h2><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Description</label><textarea name="description"></textarea></div><div class="field"><label>Duration (minutes)</label><input name="durationMinutes" type="number" min="5" max="720" value="60" required></div><div class="field"><label>Price (₹)</label><input name="price" type="number" min="0" step=".01" required></div><button class="btn primary">Add service</button></form></section><p id="admin-message" class="message"></p></main><footer class="footer"></footer></div></body></html>
